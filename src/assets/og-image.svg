<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00ADFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#00ADFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00ADFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ADFF" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="text-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADFF"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient Glow layers -->
  <rect width="1200" height="630" fill="url(#glow-cyan)"/>
  <rect width="1200" height="630" fill="url(#glow-purple)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Outer frame border with glowing gradient -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="#111622" fill-opacity="0.65" stroke="url(#border-grad)" stroke-width="2" filter="url(#card-shadow)"/>

  <!-- Window controls / Decorative header -->
  <circle cx="80" cy="78" r="7" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="104" cy="78" r="7" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="128" cy="78" r="7" fill="#10b981" fill-opacity="0.8"/>
  <text x="160" y="83" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="1">oriel.is-a.dev ~ portfolio</text>

  <!-- Status pill: Remote available -->
  <g transform="translate(860, 62)">
    <rect width="250" height="34" rx="17" fill="#0f2b38" stroke="#00ADFF" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="4.5" fill="#10b981"/>
    <text x="34" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Available for Remote / LATAM</text>
  </g>

  <!-- Main Hero Content -->
  <!-- Name -->
  <text x="80" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Oriel Romero
  </text>

  <!-- Role Title -->
  <text x="80" y="252" fill="url(#text-accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Sans', 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    Product-Minded Backend Engineer
  </text>

  <!-- Tagline / Value Proposition -->
  <text x="80" y="304" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Diseño y construyo sistemas escalables, pipelines asíncronos y soluciones orientadas a producto
  </text>

  <!-- Geographic Location / Details -->
  <g transform="translate(80, 338)">
    <rect width="400" height="36" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <text x="16" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      📍 Buenos Aires, Argentina • Remote Worldwide (UTC-3)
    </text>
  </g>

  <!-- Tech Stack Badges Container -->
  <g transform="translate(80, 412)">
    <!-- Badge 1: NestJS -->
    <g transform="translate(0, 0)">
      <rect width="105" height="38" rx="10" fill="#1a2234" stroke="#00ADFF" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="52" y="24" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="600">NestJS</text>
    </g>
    <!-- Badge 2: Node.js -->
    <g transform="translate(117, 0)">
      <rect width="110" height="38" rx="10" fill="#1a2234" stroke="#334155" stroke-width="1"/>
      <text x="55" y="24" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="500">Node.js</text>
    </g>
    <!-- Badge 3: TypeScript -->
    <g transform="translate(239, 0)">
      <rect width="130" height="38" rx="10" fill="#1a2234" stroke="#334155" stroke-width="1"/>
      <text x="65" y="24" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="500">TypeScript</text>
    </g>
    <!-- Badge 4: PostgreSQL -->
    <g transform="translate(381, 0)">
      <rect width="135" height="38" rx="10" fill="#1a2234" stroke="#334155" stroke-width="1"/>
      <text x="67" y="24" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="500">PostgreSQL</text>
    </g>
    <!-- Badge 5: BullMQ & Redis -->
    <g transform="translate(528, 0)">
      <rect width="165" height="38" rx="10" fill="#1a2234" stroke="#00ADFF" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="82" y="24" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="600">BullMQ + Redis</text>
    </g>
    <!-- Badge 6: Docker -->
    <g transform="translate(705, 0)">
      <rect width="105" height="38" rx="10" fill="#1a2234" stroke="#334155" stroke-width="1"/>
      <text x="52" y="24" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="500">Docker</text>
    </g>
    <!-- Badge 7: AI Integration -->
    <g transform="translate(822, 0)">
      <rect width="160" height="38" rx="10" fill="#1a2234" stroke="#00ADFF" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="80" y="24" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="600">✨ AI Integration</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="490" x2="1120" y2="490" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Footer Info -->
  <text x="80" y="534" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
    Founder &amp; Lead at <tspan fill="#e2e8f0" font-weight="600">CoPAS</tspan> • GitHub: <tspan fill="#00ADFF" font-weight="600">github.com/oriel-r</tspan>
  </text>

  <text x="1120" y="534" text-anchor="end" fill="#00ADFF" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace" font-size="15" font-weight="600">
    https://oriel.is-a.dev
  </text>
</svg>
