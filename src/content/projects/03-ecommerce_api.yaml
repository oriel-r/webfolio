es:
  name: "E-commerce API"
  type: "API"
  description: "API RESTful de comercio electrónico con autenticación JWT, gestión de productos, pedidos, categorías y carga de archivos a Cloudinary."
  long_description: "Backend construido con NestJS que expone endpoints para gestionar usuarios (registro, autenticación JWT, roles), productos (CRUD completo), pedidos, categorías y carga de imágenes a Cloudinary. Documentado con Swagger, utiliza TypeORM con PostgreSQL y sigue una arquitectura modular con guards de autorización."
  media:
