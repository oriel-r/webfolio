    - type: image
      src: "/ecomerce_api_oriel_romero_cover.png"
    - type: image
      src: "/ecomerce_api_oriel_romero_cover.png"
  technologies:
    - "NestJS"
    - "TypeScript"
    - "TypeORM"
    - "PostgreSQL"
    - "JWT"
    - "Cloudinary"
    - "Swagger/OpenAPI"
    - "Docker"
    - "GitHub Actions"
    - "Docker Compose"
  repository: "https://github.com/oriel-r/ecommerce-api"
  role: "Backend"
  back_repo: "https://github.com/oriel-r/ecommerce-api"
en:
  name: "E-commerce API"
  type: "API"
  description: "RESTful e-commerce API with JWT authentication, product management, orders, categories, and file uploads to Cloudinary."
  long_description: "NestJS backend exposing endpoints for user management (registration, JWT auth, roles), products (full CRUD), orders, categories, and image upload to Cloudinary. Documented with Swagger, uses TypeORM with PostgreSQL, and follows a modular architecture with authorization guards."
