en:
  name: "E-commerce API"
  type: "API"
  description: "Modular RESTful e-commerce API built with NestJS, TypeORM, PostgreSQL, role-based JWT auth, and Cloudinary uploads."
  long_description: "A modular REST API for e-commerce focusing on security and transactional consistency. Built with NestJS, PostgreSQL, and TypeORM, protecting endpoints with JWT guards and role authorization, handling media uploads to Cloudinary, and documented with Swagger."
