es:
  name: "Appointments App"
  type: "WebApp"
  description: "Aplicación para la gestión de turnos con roles de usuario y administrador, construida con Express y React."
  long_description: "App de gestión de turnos con backend en Express + TypeScript y frontend en React + Vite. Los usuarios pueden registrarse, reservar y cancelar turnos, editar su perfil. Los administradores pueden ver todos los turnos, cancelarlos y gestionar usuarios. Base de datos PostgreSQL con TypeORM, estado global con Redux Toolkit y estilos con CSS Modules."
  media:
    - type: image
      src: "/turnera_cover.png"
    - type: image
      src: "/yuri-krupenin-lNd5dX8XkKY-unsplash.jpg"
    - type: image
      src: "/yuri-krupenin-lNd5dX8XkKY-unsplash.jpg"
  technologies:
    - "Express"
    - "TypeScript"
    - "React"
    - "PostgreSQL"
    - "TypeORM"
    - "Redux Toolkit"
    - "Vite"
    - "CSS Modules"
  repository: "https://github.com/oriel-r/appointments-app-service"
  role: "Full-stack"
  back_repo: "https://github.com/oriel-r/appointments-app-service"
  front_repo: "https://github.com/oriel-r/appointments-app-client"
en:
  name: "Appointments App"
  type: "WebApp"
  description: "Appointment management application with user and admin roles, built with Express and React."
  long_description: "Appointment management app with Express + TypeScript backend and React + Vite frontend. Users can register, book and cancel appointments, edit their profile. Admins can view all appointments, cancel them, and manage users. PostgreSQL database with TypeORM, global state with Redux Toolkit, and CSS Modules for styling."
  media:
    - type: image
      src: "/turnera_cover.png"
    - type: image
