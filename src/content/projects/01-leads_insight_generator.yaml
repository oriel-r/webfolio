es:
  name: "Leads Insight Generator"
  type: "API"
  description: "Servicio backend para gestión de leads de ventas con procesamiento asíncrono y resúmenes impulsados por IA con Google Gemini."
  long_description: "Backend modular con NestJS que gestiona leads de ventas, procesa trabajos asíncronos mediante BullMQ/Redis y genera resúmenes con IA usando Google Gemini. Obtiene leads periódicamente desde randomuser.me, los almacena en PostgreSQL y permite análisis impulsados por IA. Arquitectura escalable basada en colas con Redis, Docker y migraciones de base de datos."
