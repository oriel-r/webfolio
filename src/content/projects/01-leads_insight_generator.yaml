en:
  name: "Leads Insight Generator"
  type: "API"
  description: "Backend service for sales lead management with async job processing and AI-powered summaries using Google Gemini."
  long_description: "Modular NestJS backend that manages sales leads, processes async jobs via BullMQ/Redis, and generates AI-powered summaries using Google Gemini. Periodically fetches leads from randomuser.me, stores them in PostgreSQL, and enables AI-driven analysis. Queue-based scalable architecture with Redis, Docker, and database migrations."
