es:
  name: "Online Courses Platform"
  type: "SaaS"
  description: "Plataforma de cursos online con suscripciones, pagos por Mercado Pago, chatbot con IA, roles de usuario y código de referidos."
  long_description: "Plataforma completa de aprendizaje con backend en NestJS y frontend en Next.js. Incluye registro y autenticación (JWT + Auth0), suscripciones (Básica/Premium/Pro), inscripción a cursos, pagos con Mercado Pago, chatbot con Google Gemini, carga de archivos a Cloudinary, notificaciones por email y paneles por rol (Admin, Profesor, Estudiante). Comunicación en tiempo real con Socket.io."
