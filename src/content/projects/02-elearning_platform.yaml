en:
  name: "Online Courses Platform"
  type: "SaaS"
  description: "Online course platform with subscriptions, Mercado Pago payments, AI chatbot, user roles, and referral codes."
  long_description: "Full learning platform with NestJS backend and Next.js frontend. Includes registration and authentication (JWT + Auth0), subscriptions (Basic/Premium/Pro), course enrollment, Mercado Pago payments, Google Gemini chatbot, Cloudinary file uploads, email notifications, and role-based dashboards (Admin, Teacher, Student). Real-time communication via Socket.io."
