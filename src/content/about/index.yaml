photo: "/oriel_romero_portrait.jpg"
es:
  title: "Mi porqué"
  text:
    - 'De chico desconfiguraba la computadora de casa probando cosas y cuando la llevaba al técnico siempre pensaba "no puede ser tan difícil, tengo que aprender a arreglarla yo"'
    - 'Hoy mantengo esa curiosidad buscando siempre la causa raíz. Veo el código como un medio para desarmar la complejidad y crear sistemas que resuelvan problemas reales'
en:
  title: "My Why"
  text:
    - 'As a kid, I was always messing up the family computer trying things out, and whenever I took it to the repair shop I always thought "it can''t be that hard, I have to learn how to fix this myself"'
    - 'Today, I keep that same curiosity, always digging into the root cause. I see code as a means to break down complexity and build systems that solve real-world problems'
