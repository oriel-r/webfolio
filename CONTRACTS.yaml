# Home / Hero
- hero_title:
    - type: string
    - required: true
- hero_subtitle:
    - type: string
    - required: true
- hero_description:
    - type: string
    - required: true
# Note: All text fields are wrapped in es/en language objects (langSchema).

# Experience
- company_name:
    - type: string
    - required: true
- position:
    - type: string
    - required: true
- short_description:
    - type: string
    - required: false
- start_date:
    - type: string
    - required: false

# Projects
- name:
    - type: string
    - required: true
- type:
    - type: string
    - required: true
- description:
    - type: string
    - required: true
- images:
    - type: list
    - items:
        - type: string
    - required: false
- colaborators:
    - type: list
    - items:
        - type: object
            - name:
                - type: string
                - required: false
            - contact:
                - type: url
                - required: true
    - required: false
- technologies:
    - type: list
    - items:
        - type: string
    - required: true
- demo:
    - type: url
    - required: false
- repository:
    - type: url
    - required: true
- role:
    - type: string
    - required: false
- back_repo:
    - type: url
    - required: false
- front_repo:
    - type: url
    - required: false
- long_description:
    - type: string
    - required: false

# Skills
- name:
    - type: string
    - required: true
- icon:
    - type: string
    - required: true
- category:
    - type: string
    - required: true
    - options: ["Backend & Architecture", "DevOps & Cloud", "Frontend", "DevTool", "Databases", "AI & Automations"]
- projects:
    - type: list
    - items:
        - type: string
    - required: false

# About me data
- photo:
    - type: string
    - required: true
- title:
    - type: string
    - required: true
    - note: "Localized in es/en objects"
- text:
    - type: list
    - items:
        - type: string
    - required: true
    - note: "Localized in es/en objects"